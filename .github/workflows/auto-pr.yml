name: Auto PR

on:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'
      - dev

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # feature/* e feat/* abrem PR para dev; dev abre o PR de release para main
      - name: Open or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.ref_name }}
        run: |
          if [ "$HEAD_REF" = "dev" ]; then
            BASE=main
            TITLE="Release: dev -> main"
            LABELS="release,production"
          else
            BASE=dev
            TITLE="${{ github.event.head_commit.message }}"
            LABELS="automated,feature"
          fi

          # Nada a integrar? Nao abre PR vazio.
          if [ -z "$(git log --oneline "origin/$BASE..origin/$HEAD_REF")" ]; then
            echo "Sem commits novos em $HEAD_REF relativos a $BASE; nada a fazer."
            exit 0
          fi

          EXISTING=$(gh pr list --head "$HEAD_REF" --base "$BASE" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING ja aberto para $HEAD_REF -> $BASE."
            exit 0
          fi

          gh pr create \
            --head "$HEAD_REF" \
            --base "$BASE" \
            --title "${TITLE%%$'\n'*}" \
            --body "PR aberto automaticamente a partir de \`$HEAD_REF\` por @${{ github.actor }}." \
            --label "$LABELS"
