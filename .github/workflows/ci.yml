name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Uma execucao por branch/PR: pushes seguidos cancelam a anterior
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Versoes suportadas pelo Vite 8 (^20.19 || >=22.12). Node 18 esta EOL.
        node-version: ['20.19', '22.12', '24']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Upload dist
        if: matrix.node-version == '22.12'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error
